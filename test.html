<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Git Project</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
            margin-top:80px;
        }

        .container{
            width:60%;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            color:#0077cc;
        }

        p{
            font-size:18px;
        }

        button{
            background:#0077cc;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#005fa3;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Welcome to My Git Practice</h1>

    <p>
        My name is Rangith.
    </p>

    <p>
        I am learning Linux, Git, AWS and DevOps.
    </p>

    <button onclick="showMessage()">
        Click Me
    </button>

    <h3 id="demo"></h3>

</div>

<script>

function showMessage(){
    document.getElementById("demo").innerHTML =
    "🚀 Git is awesome!";
}

</script>

</body>
</html>
